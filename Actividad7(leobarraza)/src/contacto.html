<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

<body>
    <header class="encabezado-principal">
        <img src="./resources/perro.png" alt="Perro pug" class="logo">
        <h1>Lic. Mateo Rossi</h1>
        <p>Psicología Clínica y Psicoterapia</p>
        <nav>

                <li> <a href="index.html">Inicio </a> </li>

    <main class="cuerpo-principal">
        <section>
            <h2>Contacto</h2>
            <p>Estoy aquí para ayudarte. Por favor, completa el siguiente formulario y me pondré en contacto contigo
                a la brevedad posible.</p>
            <form action="./contacto.html" method="get">
                <label for="nombre">nombre y apellido</label>
                <input type="text" id="nombre" name="nombre">

                <label for="mail">mail</label>
                <input type="email" id="mail" name="mail">

                <label for="numero">numero</label>
                <input type="tel" id="numero" name="numero">

                <button>Enviar consulta </button>
            </form>
        </section>

        <p>2026 Lic. Mateo Rossi.</p>
    </footer>
